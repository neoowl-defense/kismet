name: neoowl-secret-scan
# Secret-scanning gate. Scans only the commits a push/PR introduces (not full
# history), so pre-existing history never blocks work — but a newly committed
# secret fails the check. gitleaks CLI: no license required. Respects this
# repo's .gitleaks.toml allowlist and .gitleaksignore baseline automatically.
#
# Commits that are already on upstream kismetwireless/kismet master are left
# out: merging upstream brings in hundreds of its commits, and its test
# scripts' throwaway logins (curl -u name:name) failed the gate on code that
# isn't ours. Our own commits, including merge resolutions, are still scanned.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream Kismet master
        run: git fetch --no-tags --quiet https://github.com/kismetwireless/kismet.git master:refs/upstream/master
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_PR_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --verbose lists each finding (file, line, rule; the secret stays redacted)
          C="--redact --verbose --no-banner --exit-code 1"
          NOT_UPSTREAM="--not refs/upstream/master"
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning PR range ${BASE_SHA}..${HEAD_PR_SHA}, without upstream's commits"
            gitleaks detect --source . $C --log-opts="${BASE_SHA}..${HEAD_PR_SHA} ${NOT_UPSTREAM}"
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: scanning latest commit only, unless it's upstream's"
            gitleaks detect --source . $C --log-opts="-1 ${HEAD_SHA} ${NOT_UPSTREAM}"
          else
            echo "Scanning push range ${BEFORE}..${HEAD_SHA}, without upstream's commits"
            gitleaks detect --source . $C --log-opts="${BEFORE}..${HEAD_SHA} ${NOT_UPSTREAM}"
          fi
